route:
  receiver: telegram
  group_by: [alertname, severity, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token: __BOT_TOKEN__
        chat_id: __CHAT_ID__
        parse_mode: HTML
        message: |
          <b>{{ .Status | toUpper }}</b>
          {{ range .Alerts }}
          <b>{{ .Labels.alertname }}</b>
          <b>Instancia:</b> {{ .Labels.instance }}
          <b>Severidad:</b> {{ .Labels.severity }}
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
