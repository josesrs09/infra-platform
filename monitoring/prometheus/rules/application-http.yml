groups:
  - name: application-http
    rules:
      - alert: ApplicationHighHttpErrorRate
        expr: |
          sum by (job, application) (rate(http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum by (job, application) (rate(http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: critical
          source: application-http
        annotations:
          summary: "Alta tasa de errores HTTP en {{ $labels.application }}"
          description: "Más del 5% de las solicitudes HTTP están respondiendo 5xx durante 5 minutos."

      - alert: ApplicationHighHttpTraffic
        expr: sum by (job, application) (rate(http_requests_total[5m])) > 100
        for: 10m
        labels:
          severity: warning
          source: application-http
        annotations:
          summary: "Consumo HTTP alto en {{ $labels.application }}"
          description: "La aplicación supera 100 solicitudes por segundo durante 10 minutos."

      - alert: ApplicationHighHttpLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le, job, application) (rate(http_request_duration_seconds_bucket[5m]))
          ) > 2
        for: 5m
        labels:
          severity: warning
          source: application-http
        annotations:
          summary: "Latencia HTTP alta en {{ $labels.application }}"
          description: "El percentil 95 supera 2 segundos durante 5 minutos."

      - alert: ApplicationMetricsMissing
        expr: up{job="applications"} == 0
        for: 3m
        labels:
          severity: critical
          source: application-http
        annotations:
          summary: "Métricas no disponibles para {{ $labels.application }}"
          description: "Prometheus no puede consultar el endpoint de métricas de la aplicación."
