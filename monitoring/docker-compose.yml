services:
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: infra-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./data/prometheus:/prometheus
    networks: [monitoring, proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=infra_proxy
      - traefik.http.routers.prometheus.rule=Host(`${PROMETHEUS_HOST}`)
      - traefik.http.routers.prometheus.entrypoints=websecure
      - traefik.http.routers.prometheus.tls.certresolver=letsencrypt
      - traefik.http.services.prometheus.loadbalancer.server.port=9090

  grafana:
    image: grafana/grafana:11.5.2
    container_name: infra-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://${GRAFANA_HOST}
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [monitoring, proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=infra_proxy
      - traefik.http.routers.grafana.rule=Host(`${GRAFANA_HOST}`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls.certresolver=letsencrypt
      - traefik.http.services.grafana.loadbalancer.server.port=3000

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: infra-alertmanager
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      sed -e "s|__BOT_TOKEN__|$${TELEGRAM_BOT_TOKEN}|g" \
          -e "s|__CHAT_ID__|$${TELEGRAM_CHAT_ID}|g" \
          /etc/alertmanager/alertmanager.template.yml > /alertmanager/alertmanager.yml
      exec /bin/alertmanager --config.file=/alertmanager/alertmanager.yml --storage.path=/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.template.yml:ro
      - ./data/alertmanager:/alertmanager
    networks: [monitoring]

  node-exporter:
    image: prom/node-exporter:v1.9.0
    container_name: infra-node-exporter
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks: [monitoring]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    container_name: infra-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks: [monitoring]

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.26.0
    container_name: infra-blackbox
    restart: unless-stopped
    volumes:
      - ./blackbox/blackbox.yml:/config/blackbox.yml:ro
    command: --config.file=/config/blackbox.yml
    networks: [monitoring]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: infra-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@infra-postgres:5432/${POSTGRES_DB}?sslmode=disable
    networks: [monitoring, database]

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.17.2
    container_name: infra-mysqld-exporter
    restart: unless-stopped
    environment:
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      sed -e "s|__MYSQL_USER__|$${MYSQL_USER}|g" \
          -e "s|__MYSQL_PASSWORD__|$${MYSQL_PASSWORD}|g" \
          /cfg/.my.cnf.template > /tmp/.my.cnf
      exec /bin/mysqld_exporter --config.my-cnf=/tmp/.my.cnf
    volumes:
      - ./exporters/mysql/.my.cnf:/cfg/.my.cnf.template:ro
    networks: [monitoring, database]

  redis-exporter:
    image: oliver006/redis_exporter:v1.69.0
    container_name: infra-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://infra-redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [monitoring, database]

networks:
  monitoring:
    external: true
    name: infra_monitoring
  proxy:
    external: true
    name: infra_proxy
  database:
    external: true
    name: infra_database
