services:
  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    container_name: infra-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - ./data/minio:/data
    networks:
      - storage
      - proxy
      - monitoring
    labels:
      - traefik.enable=true
      - traefik.docker.network=infra_proxy
      - traefik.http.routers.minio.rule=Host(`${MINIO_HOST}`)
      - traefik.http.routers.minio.entrypoints=websecure
      - traefik.http.routers.minio.tls.certresolver=letsencrypt
      - traefik.http.services.minio.loadbalancer.server.port=9000
      - traefik.http.routers.minio-console.rule=Host(`${MINIO_CONSOLE_HOST}`)
      - traefik.http.routers.minio-console.entrypoints=websecure
      - traefik.http.routers.minio-console.tls.certresolver=letsencrypt
      - traefik.http.routers.minio-console.middlewares=admin-chain@file
      - traefik.http.services.minio-console.loadbalancer.server.port=9001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  storage:
    external: true
    name: infra_storage
  proxy:
    external: true
    name: infra_proxy
  monitoring:
    external: true
    name: infra_monitoring
