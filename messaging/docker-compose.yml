services:
  emqx:
    image: emqx/emqx:5.8.5
    container_name: infra-emqx
    restart: unless-stopped
    environment:
      EMQX_NODE_NAME: emqx@127.0.0.1
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USER}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD}
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./data/emqx:/opt/emqx/data
      - ./logs/emqx:/opt/emqx/log
    networks: [messaging, proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=infra_proxy
      - traefik.http.routers.emqx.rule=Host(`${EMQX_HOST}`)
      - traefik.http.routers.emqx.entrypoints=websecure
      - traefik.http.routers.emqx.tls.certresolver=letsencrypt
      - traefik.http.routers.emqx.middlewares=admin-chain@file
      - traefik.http.services.emqx.loadbalancer.server.port=18083

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    container_name: infra-rabbitmq
    restart: unless-stopped
    hostname: infra-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    ports:
      - "5672:5672"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    networks: [messaging, proxy, monitoring]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
    labels:
      - traefik.enable=true
      - traefik.docker.network=infra_proxy
      - traefik.http.routers.rabbitmq.rule=Host(`${RABBITMQ_HOST}`)
      - traefik.http.routers.rabbitmq.entrypoints=websecure
      - traefik.http.routers.rabbitmq.tls.certresolver=letsencrypt
      - traefik.http.routers.rabbitmq.middlewares=admin-chain@file
      - traefik.http.services.rabbitmq.loadbalancer.server.port=15672

networks:
  messaging:
    external: true
    name: infra_messaging
  proxy:
    external: true
    name: infra_proxy
  monitoring:
    external: true
    name: infra_monitoring
