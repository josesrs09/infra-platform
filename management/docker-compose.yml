services:
  portainer:
    image: portainer/portainer-ce:2.21.5
    container_name: infra-portainer
    restart: unless-stopped
    command: -H unix:///var/run/docker.sock
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data/portainer:/data
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=infra_proxy
      - traefik.http.routers.portainer.rule=Host(`${PORTAINER_HOST}`)
      - traefik.http.routers.portainer.entrypoints=websecure
      - traefik.http.routers.portainer.tls.certresolver=letsencrypt
      - traefik.http.routers.portainer.middlewares=admin-chain@file
      - traefik.http.services.portainer.loadbalancer.server.port=9000

  uptime-kuma:
    image: louislam/uptime-kuma:1.23.16
    container_name: infra-uptime-kuma
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data/uptime-kuma:/app/data
    networks:
      - proxy
      - monitoring
    labels:
      - traefik.enable=true
      - traefik.docker.network=infra_proxy
      - traefik.http.routers.uptime.rule=Host(`${UPTIME_HOST}`)
      - traefik.http.routers.uptime.entrypoints=websecure
      - traefik.http.routers.uptime.tls.certresolver=letsencrypt
      - traefik.http.routers.uptime.middlewares=admin-chain@file
      - traefik.http.services.uptime.loadbalancer.server.port=3001

  homepage:
    image: ghcr.io/gethomepage/homepage:v1.1.1
    container_name: infra-homepage
    restart: unless-stopped
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_HOST}
      HOMEPAGE_VAR_DOMAIN: ${DOMAIN}
    volumes:
      - ./homepage:/app/config:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=infra_proxy
      - traefik.http.routers.homepage.rule=Host(`${HOMEPAGE_HOST}`)
      - traefik.http.routers.homepage.entrypoints=websecure
      - traefik.http.routers.homepage.tls.certresolver=letsencrypt
      - traefik.http.routers.homepage.middlewares=admin-chain@file
      - traefik.http.services.homepage.loadbalancer.server.port=3000

networks:
  proxy:
    external: true
    name: infra_proxy
  monitoring:
    external: true
    name: infra_monitoring
