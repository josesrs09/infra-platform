route:
  receiver: telegram-webhook
  group_by: ['alertname','environment','application']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: telegram-webhook
    webhook_configs:
      - url: http://backend:8080/api/v1/internal/alerts/alertmanager
        send_resolved: true
