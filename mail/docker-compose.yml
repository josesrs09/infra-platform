services:
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:14.0.0
    container_name: infra-mailserver
    hostname: ${MAIL_HOSTNAME}
    domainname: ${MAIL_DOMAIN}
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      ENABLE_RSPAMD: "1"
      ENABLE_CLAMAV: "0"
      ENABLE_FAIL2BAN: "1"
      ENABLE_AMAVIS: "0"
      ENABLE_POSTGREY: "0"
      ENABLE_SASLAUTHD: "0"
      ENABLE_OPENDKIM: "1"
      ENABLE_OPENDMARC: "1"
      ENABLE_MANAGESIEVE: "1"
      SSL_TYPE: letsencrypt
      LOG_LEVEL: info
      POSTMASTER_ADDRESS: ${POSTMASTER_ADDRESS}
      PERMIT_DOCKER: network
      ONE_DIR: "1"
      TZ: ${TZ}
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
      - "4190:4190"
    volumes:
      - ./data/mail:/var/mail
      - ./data/state:/var/mail-state
      - ./logs:/var/log/mail
      - ./config:/tmp/docker-mailserver
      - /etc/letsencrypt:/etc/letsencrypt:ro
    cap_add:
      - NET_ADMIN
    networks:
      backend:
        aliases:
          - ${MAIL_HOSTNAME}.${MAIL_DOMAIN}
      monitoring:
    healthcheck:
      test: ["CMD-SHELL", "ss --listening --tcp | grep -P 'LISTEN.+:smtp' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  roundcube-db:
    image: mariadb:11.4
    container_name: infra-roundcube-db
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      MARIADB_DATABASE: ${ROUNDCUBE_DB_NAME}
      MARIADB_USER: ${ROUNDCUBE_DB_USER}
      MARIADB_PASSWORD: ${ROUNDCUBE_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${ROUNDCUBE_DB_ROOT_PASSWORD}
    volumes:
      - ./data/roundcube-db:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  roundcube:
    image: roundcube/roundcubemail:1.6.11-apache
    container_name: infra-roundcube
    restart: unless-stopped
    depends_on:
      mailserver:
        condition: service_healthy
      roundcube-db:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      ROUNDCUBEMAIL_DB_TYPE: mysql
      ROUNDCUBEMAIL_DB_HOST: roundcube-db
      ROUNDCUBEMAIL_DB_PORT: 3306
      ROUNDCUBEMAIL_DB_NAME: ${ROUNDCUBE_DB_NAME}
      ROUNDCUBEMAIL_DB_USER: ${ROUNDCUBE_DB_USER}
      ROUNDCUBEMAIL_DB_PASSWORD: ${ROUNDCUBE_DB_PASSWORD}
      ROUNDCUBEMAIL_DEFAULT_HOST: ssl://${MAIL_HOSTNAME}.${MAIL_DOMAIN}
      ROUNDCUBEMAIL_DEFAULT_PORT: 993
      ROUNDCUBEMAIL_SMTP_SERVER: tls://${MAIL_HOSTNAME}.${MAIL_DOMAIN}
      ROUNDCUBEMAIL_SMTP_PORT: 587
      ROUNDCUBEMAIL_SKIN: elastic
      ROUNDCUBEMAIL_PLUGINS: archive,zipdownload,managesieve,markasjunk
      ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE: 50M
    volumes:
      - ./config/roundcube:/var/roundcube/config
      - ./data/roundcube-temp:/tmp/roundcube-temp
    networks:
      - proxy
      - backend
      - monitoring
    labels:
      - traefik.enable=true
      - traefik.docker.network=infra_proxy
      - traefik.http.routers.roundcube.rule=Host(`${WEBMAIL_HOST}`)
      - traefik.http.routers.roundcube.entrypoints=websecure
      - traefik.http.routers.roundcube.tls=true
      - traefik.http.routers.roundcube.tls.certresolver=letsencrypt
      - traefik.http.routers.roundcube.middlewares=security-headers@file
      - traefik.http.services.roundcube.loadbalancer.server.port=80
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$s=@fsockopen(\"127.0.0.1\",80); if(!$$s) exit(1); fclose($$s);'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  proxy:
    external: true
    name: infra_proxy
  backend:
    external: true
    name: infra_backend
  monitoring:
    external: true
    name: infra_monitoring
