services:
  postgres:
    image: postgres:17.4-alpine
    container_name: infra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.4.4
    container_name: infra-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: ${TZ}
    command: --default-authentication-plugin=caching_sha2_password
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./init/mysql:/docker-entrypoint-initdb.d:ro
    networks:
      - database
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.2-alpine
    container_name: infra-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - ./data/redis:/data
    networks:
      - database
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:9.1
    container_name: infra-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_CONFIG_LOGIN_BANNER: "Infra Platform - acceso administrativo"
    volumes:
      - ./data/pgadmin:/var/lib/pgadmin
    networks:
      - database
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=infra_proxy
      - traefik.http.routers.pgadmin.rule=Host(`${PGADMIN_HOST}`)
      - traefik.http.routers.pgadmin.entrypoints=websecure
      - traefik.http.routers.pgadmin.tls.certresolver=letsencrypt
      - traefik.http.routers.pgadmin.middlewares=admin-chain@file
      - traefik.http.services.pgadmin.loadbalancer.server.port=80

  phpmyadmin:
    image: phpmyadmin:5.2.2-apache
    container_name: infra-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: infra-mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 256M
    networks:
      - database
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=infra_proxy
      - traefik.http.routers.phpmyadmin.rule=Host(`${PHPMYADMIN_HOST}`)
      - traefik.http.routers.phpmyadmin.entrypoints=websecure
      - traefik.http.routers.phpmyadmin.tls.certresolver=letsencrypt
      - traefik.http.routers.phpmyadmin.middlewares=admin-chain@file
      - traefik.http.services.phpmyadmin.loadbalancer.server.port=80

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: infra-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:infra-redis:6379:0:${REDIS_PASSWORD}
      HTTP_USER: ${REDIS_COMMANDER_USER}
      HTTP_PASSWORD: ${REDIS_COMMANDER_PASSWORD}
    networks:
      - database
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=infra_proxy
      - traefik.http.routers.rediscommander.rule=Host(`${REDIS_COMMANDER_HOST}`)
      - traefik.http.routers.rediscommander.entrypoints=websecure
      - traefik.http.routers.rediscommander.tls.certresolver=letsencrypt
      - traefik.http.routers.rediscommander.middlewares=admin-chain@file
      - traefik.http.services.rediscommander.loadbalancer.server.port=8081

  adminer:
    image: adminer:5.3.0
    container_name: infra-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: infra-postgres
    networks:
      - database
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=infra_proxy
      - traefik.http.routers.adminer.rule=Host(`${ADMINER_HOST}`)
      - traefik.http.routers.adminer.entrypoints=websecure
      - traefik.http.routers.adminer.tls.certresolver=letsencrypt
      - traefik.http.routers.adminer.middlewares=admin-chain@file
      - traefik.http.services.adminer.loadbalancer.server.port=8080

networks:
  database:
    external: true
    name: infra_database
  proxy:
    external: true
    name: infra_proxy
